name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install dependencies
      run: |
        sudo apt install -y git zip unzip build-essential
        pip install buildozer cython
    - name: Build APK
      run: |
        export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
        yes | buildozer android debug 2>&1 | tee build.log || true
        yes | $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: myapp
        path: bin/*.apk
